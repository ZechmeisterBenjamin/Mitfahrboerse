version: '3.9'

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=${SA_PASSWORD}
      - MSSQL_AUTHENTICATION_MODE=SqlAuth
    ports:
      - "1433:1433"
    volumes:
      - sql_data:/var/opt/mssql
    restart: always

  mitfahrboerse:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mitfahrboerse
    depends_on:
      - db
    ports:
      - "8080:8080"
      - "8081:8081"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=db;Database=Mitfahrboerse;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True;
      - AzureAd__TenantId=${AZUREAD_TENANT_ID}
      - AzureAd__ClientId=${AZUREAD_CLIENT_ID}
      - AzureAd__ClientSecret=${AZUREAD_CLIENT_SECRET}
      - PointsApi__ApiKey=${POINTS_API_KEY}

volumes:
  sql_data:
